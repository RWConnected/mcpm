name: Release JS CLI (Linux + Docker)

# Independent of Release.yml/build.yml (legacy Rust pipeline) — builds and releases the
# Bun/TypeScript CLI for Linux plus its Docker image. Scoped to v2+ tags so it never fires
# for old Rust-era v1.0.x tags.

on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mcpm

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux binary
        run: bun build --compile --minify packages/cli/src/index.ts --outfile mcpm

      - name: Package binary
        id: package
        run: |
          OUT="mcpm-cli-${{ github.ref_name }}-linux-x86_64.tar.gz"
          tar -czf "$OUT" mcpm
          echo "archive=$OUT" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksum
        id: checksum
        run: |
          FILE="${{ steps.package.outputs.archive }}"
          shasum -a 256 "$FILE" > "$FILE.sha256"
          echo "checksum_file=$FILE.sha256" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.beta
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:beta

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.checksum.outputs.checksum_file }}
